<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Vérification responsive DAVIDEL</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #242124; color: #fff; font: 14px system-ui, sans-serif; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 16px; padding: 14px; }
    h1 { font-size: 16px; margin: 0; }
    label { display: flex; align-items: center; gap: 8px; }
    select { padding: 8px; color: #fff; background: #121012; border: 1px solid #665b62; border-radius: 4px; }
    #dimensions { color: #f7a5d0; }
    #viewport { position: relative; margin: 0 auto 16px; background: #060506; box-shadow: 0 0 0 1px #665b62; }
    iframe { position: absolute; top: 0; left: 0; display: block; border: 0; transform-origin: top left; }
  </style>
</head>
<body>
  <header>
    <h1>DAVIDEL · Vérification responsive</h1>
    <label for="device">Écran
      <select id="device">
        <option value="320x568">Petit téléphone · 320 × 568</option>
        <option value="360x800">Android compact · 360 × 800</option>
        <option value="390x844" selected>Téléphone · 390 × 844</option>
        <option value="430x932">Grand téléphone · 430 × 932</option>
        <option value="844x390">Téléphone paysage · 844 × 390</option>
        <option value="768x1024">Tablette portrait · 768 × 1024</option>
        <option value="1024x768">Tablette paysage · 1024 × 768</option>
        <option value="1081x800">Transition ordinateur · 1081 × 800</option>
        <option value="1280x800">Ordinateur · 1280 × 800</option>
        <option value="1920x1080">Grand écran · 1920 × 1080</option>
      </select>
    </label>
    <output id="dimensions">390 × 844 px</output>
  </header>
  <div id="viewport">
    <iframe id="site" title="DAVIDEL" src="./" width="390" height="844"></iframe>
  </div>
  <script>
    const device = document.querySelector('#device');
    const frame = document.querySelector('#site');
    const viewport = document.querySelector('#viewport');
    const dimensions = document.querySelector('#dimensions');
    function resize() {
      const [width, height] = device.value.split('x').map(Number);
      const availableHeight = window.innerHeight - document.querySelector('header').offsetHeight - 24;
      const scale = Math.min(1, (window.innerWidth - 32) / width, availableHeight / height);
      frame.width = width;
      frame.height = height;
      frame.style.transform = `scale(${scale})`;
      viewport.style.width = `${width * scale}px`;
      viewport.style.height = `${height * scale}px`;
      dimensions.textContent = `${width} × ${height} px`;
    }
    device.addEventListener('change', resize);
    window.addEventListener('resize', resize);
    resize();
  </script>
</body>
</html>
